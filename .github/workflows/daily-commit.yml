name: Daily README Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with timestamp
        run: |
          echo "Last automated commit: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> README.md

      - name: Commit and push changes
        run: |
          git config --global user.name "SnowMenchnik"
          git config --global user.email "150929288+SnowMenchik@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Daily automated commit: $(date -u '+%Y-%m-%d')"
          git push
